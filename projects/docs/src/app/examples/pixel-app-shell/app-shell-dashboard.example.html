<div class="demo-frame">
  <pixel-app-shell>
    <pixel-header sticky>
      <pixel-button
        appearance="icon"
        leadingIcon="menu"
        ariaLabel="Toggle navigation"
        (click)="sidenavOpen.set(!sidenavOpen())"
      />
      <h2 class="title">Acme Admin</h2>
    </pixel-header>

    <pixel-sidenav [(opened)]="sidenavOpen">
      <nav class="nav" aria-label="Primary">
        @for (link of navLinks; track link) {
          <a
            class="nav__link"
            [class.nav__link--active]="link === activeLink()"
            (click)="activeLink.set(link)"
          >
            {{ link }}
          </a>
        }
      </nav>
    </pixel-sidenav>

    <pixel-footer>
      <span>© 2026 Acme Inc.</span>
    </pixel-footer>

    <pixel-container maxWidth="xl">
      <h1 class="page-title">{{ activeLink() }}</h1>
      <div class="cards">
        <div class="card">Revenue</div>
        <div class="card">Active users</div>
        <div class="card">Open tickets</div>
      </div>
      <p class="hint">
        Drag the bottom-right handle to resize this frame narrower than 900px — the sidenav
        automatically switches to an overlay drawer.
      </p>
    </pixel-container>
  </pixel-app-shell>
</div>
