<pixel-stepper type="wizard" navigationMode="linear">
  <pixel-step label="Required">
    <pixel-step-content>You must pass through this step.</pixel-step-content>
  </pixel-step>
  <pixel-step label="Promo code" [optional]="true">
    <pixel-step-content>Have a promo code? Otherwise skip ahead.</pixel-step-content>
  </pixel-step>
  <pixel-step label="Confirm">
    <pixel-step-content>All set.</pixel-step-content>
  </pixel-step>
</pixel-stepper>
