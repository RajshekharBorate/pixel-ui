@if (showSkeleton()) {
  <div class="pixel-datepicker__skeleton" [class.pixel-datepicker__skeleton--left]="labelPosition() === 'left'">
    @if (shouldShowSkeletonLabel()) {
      <pixel-skeleton class="pixel-datepicker__skeleton-label" width="38%" height="0.7rem" />
    }
    <pixel-skeleton class="pixel-datepicker__skeleton-field" shape="rounded" [height]="skeletonFieldHeight()" />
    @if (helperText()) {
      <pixel-skeleton class="pixel-datepicker__skeleton-helper" width="55%" height="0.65rem" />
    }
  </div>
} @else {
<div class="pixel-datepicker" [class.pixel-datepicker--open]="isOpen()">
  <div #fieldWrap class="pixel-datepicker__field">
    <pixel-input
      #inputRef
      className="pixel-datepicker__input"
      [id]="fieldId()"
      [label]="label()"
      [labelPosition]="labelPosition()"
      [size]="size()"
      [value]="displayText()"
      [placeholder]="placeholder()"
      [disabled]="isFieldDisabled()"
      [readonly]="readonly()"
      [inheritParentControlErrors]="inheritParentControlErrors()"
      [required]="required()"
      [helperText]="effectiveHelperText()"
      [validationMessages]="inputValidationMessages()"
      [errorOverride]="inputErrorOverride()"
      [showClear]="showClear()"
      trailingIcon="calendar_today"
      trailingIconLabel="Open calendar"
      [trailingIconTabIndex]="-1"
      [trailingIconDisabled]="isPickerDisabled()"
      [trailingIconBypassHostDisabled]="true"
      [ariaLabel]="ariaLabel()"
      [ariaHasPopup]="'dialog'"
      [ariaExpanded]="isOpen()"
      [ariaControls]="isOpen() ? panelId : ''"
      [autocomplete]="'off'"
      [focusedChrome]="isOpen()"
      (inputChange)="onInputChange($event)"
      (focusChange)="onInputFocusChange($event)"
      (enterPress)="onInputEnter($event)"
      (clearClick)="onClear($event)"
      (trailingIconClick)="toggle()"
      (nativeKeydown)="onInputKeydown($event)"
    />

    <!-- Prefetch calendar JS on field hover (does not render — `when false`). -->
    @defer (when false; prefetch on hover(fieldWrap)) {
      <pixel-calendar />
    }

    <!--
      @if destroys the panel on close (`@defer when` does not revert after first trigger).
      @defer (on immediate) splits calendar JS so closed pickers stay lean; chunk caches after first open.
      Overlay attach waits for the real `#panelRef` + calendar — the loading shell stays inline until then.
    -->
    @if (isOpen()) {
      @defer (on immediate) {
        <div
          #panelRef
          class="pixel-datepicker__panel"
          [class.pixel-datepicker__panel--top]="effectivePanelEdge() === 'top'"
          role="dialog"
          aria-modal="false"
          [id]="panelId"
          [attr.aria-label]="label() || chooseDateAriaLabel()"
        >
          <pixel-calendar
            #calendarRef
            mode="single"
            [selected]="selectedDate()"
            [min]="min()"
            [max]="max()"
            [dateFilter]="dateFilter()"
            [dateClass]="dateClass()"
            [firstDayOfWeek]="firstDayOfWeek()"
            [locale]="resolvedLocale()"
            [startView]="startView()"
            [showOutsideDays]="showOutsideDays()"
            [disabled]="!canCommitFromPicker()"
            (daySelected)="onCalendarDaySelected($event)"
            (escapePressed)="onCalendarEscape()"
          />
          @if (showActions()) {
            <div class="pixel-datepicker__actions">
              <pixel-button appearance="text" size="sm" (click)="cancelPanel()">
                {{ cancelLabel() }}
              </pixel-button>
              <pixel-button
                appearance="solid"
                size="sm"
                [disabled]="!selectedDate()"
                (click)="confirmPanel()"
              >
                {{ applyLabel() }}
              </pixel-button>
            </div>
          }
        </div>
      } @placeholder {
        <div
          class="pixel-datepicker__panel pixel-datepicker__panel--loading"
          [class.pixel-datepicker__panel--top]="effectivePanelEdge() === 'top'"
          role="dialog"
          aria-modal="false"
          [id]="panelId"
          [attr.aria-label]="label() || chooseDateAriaLabel()"
          aria-busy="true"
        >
          <div class="pixel-datepicker__calendar-placeholder"></div>
        </div>
      } @loading {
        <div
          class="pixel-datepicker__panel pixel-datepicker__panel--loading"
          [class.pixel-datepicker__panel--top]="effectivePanelEdge() === 'top'"
          role="dialog"
          aria-modal="false"
          [id]="panelId"
          [attr.aria-label]="label() || chooseDateAriaLabel()"
          aria-busy="true"
        >
          <div class="pixel-datepicker__calendar-placeholder"></div>
        </div>
      }
    }
  </div>
</div>
}
