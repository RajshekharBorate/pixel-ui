<div class="pixel-notification-preferences__header">
  <h2 class="pixel-notification-preferences__heading">{{ heading() }}</h2>
  <pixel-button appearance="text" size="sm" (click)="reset()">Reset</pixel-button>
</div>

<section class="pixel-notification-preferences__section" aria-labelledby="pixel-notification-prefs-categories">
  <h3 id="pixel-notification-prefs-categories" class="pixel-notification-preferences__section-title">
    Muted categories
  </h3>
  @if (categories().length === 0) {
    <p class="pixel-notification-preferences__empty">No categories available.</p>
  } @else {
    <ul class="pixel-notification-preferences__list">
      @for (category of categories(); track category) {
        <li>
          <pixel-checkbox
            [label]="'Mute ' + category"
            [checked]="mutedSet().has(category)"
            (checkedChange)="toggleCategory(category, $event)"
          />
        </li>
      }
    </ul>
  }
</section>

<section class="pixel-notification-preferences__section" aria-labelledby="pixel-notification-prefs-channels">
  <h3 id="pixel-notification-prefs-channels" class="pixel-notification-preferences__section-title">
    Interruptive channels
  </h3>
  <ul class="pixel-notification-preferences__list">
    @for (channel of interruptChannels; track channel) {
      <li>
        <pixel-checkbox
          [label]="'Disable ' + channel"
          [checked]="disabledChannelSet().has(channel)"
          (checkedChange)="toggleChannel(channel, $event)"
        />
      </li>
    }
  </ul>
</section>

<section class="pixel-notification-preferences__section" aria-labelledby="pixel-notification-prefs-quiet">
  <h3 id="pixel-notification-prefs-quiet" class="pixel-notification-preferences__section-title">
    Quiet hours
  </h3>
  <pixel-checkbox
    label="Enable quiet hours"
    [checked]="preferences().quietHoursEnabled"
    (checkedChange)="setQuietHoursEnabled($event)"
  />
  <div class="pixel-notification-preferences__quiet-hours">
    <pixel-input
      label="Starts (HH:mm)"
      placeholder="22:00"
      [value]="preferences().quietHoursStart"
      [disabled]="!preferences().quietHoursEnabled"
      (valueChange)="setQuietHoursStart($event)"
    />
    <pixel-input
      label="Ends (HH:mm)"
      placeholder="07:00"
      [value]="preferences().quietHoursEnd"
      [disabled]="!preferences().quietHoursEnabled"
      (valueChange)="setQuietHoursEnd($event)"
    />
  </div>
</section>
