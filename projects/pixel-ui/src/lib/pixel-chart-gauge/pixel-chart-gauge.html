<span class="pixel-chart-gauge__sr-only" aria-live="polite" aria-atomic="true">
  {{ summary() }}
</span>
<pixel-chart-host
  [option]="option()"
  [palette]="palette()"
  [ariaLabel]="resolvedAriaLabel()"
  [height]="height()"
  [loading]="loading()"
  [themeVersion]="themeVersion()"
/>
<footer class="pixel-chart-gauge__footer">
  <div>
    <span class="pixel-chart-gauge__footer-label">Min</span>
    <span class="pixel-chart-gauge__footer-value">{{ footerMin() }}</span>
  </div>
  <div>
    <span class="pixel-chart-gauge__footer-label">Max</span>
    <span class="pixel-chart-gauge__footer-value">{{ footerMax() }}</span>
  </div>
  <div>
    <span class="pixel-chart-gauge__footer-label">Value</span>
    <span class="pixel-chart-gauge__footer-value">{{ footerValue() }}</span>
  </div>
</footer>
