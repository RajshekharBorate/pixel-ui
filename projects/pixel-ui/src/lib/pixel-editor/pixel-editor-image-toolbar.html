<div class="pixel-editor-image-toolbar__group" role="group" aria-label="Align">
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="format_align_left"
    ariaLabel="Align start"
    pixelTooltip="Align start"
    [pressed]="state().align === 'start'"
    toggleable
    (click)="alignChange.emit('start')"
  />
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="format_align_center"
    ariaLabel="Align center"
    pixelTooltip="Align center"
    [pressed]="state().align === 'center'"
    toggleable
    (click)="alignChange.emit('center')"
  />
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="format_align_right"
    ariaLabel="Align end"
    pixelTooltip="Align end"
    [pressed]="state().align === 'end'"
    toggleable
    (click)="alignChange.emit('end')"
  />
</div>

<pixel-divider orientation="vertical" class="pixel-editor-image-toolbar__rule" />

<div class="pixel-editor-image-toolbar__group" role="group" aria-label="Width">
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="aspect_ratio"
    trailingIcon="arrow_drop_down"
    [ariaLabel]="'Image width: ' + widthLabel()"
    pixelTooltip="Width"
    [pixelMenuTriggerFor]="widthMenu"
  />
  <pixel-menu #widthMenu ariaLabel="Image width">
    @for (opt of widthOptions; track opt.value) {
      <pixel-menu-item
        [icon]="state().width === opt.value ? 'check' : 'aspect_ratio'"
        [iconColor]="state().width === opt.value ? 'primary' : 'default'"
        (selected)="widthChange.emit(opt.value)"
      >
        {{ opt.label }}
      </pixel-menu-item>
    }
  </pixel-menu>
</div>

<pixel-divider orientation="vertical" class="pixel-editor-image-toolbar__rule" />

<div class="pixel-editor-image-toolbar__group" role="group" aria-label="Float">
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="keyboard_tab"
    ariaLabel="Float start"
    pixelTooltip="Float start"
    [pressed]="state().float === 'start'"
    toggleable
    (click)="floatChange.emit('start')"
  />
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="keyboard_return"
    ariaLabel="Float end"
    pixelTooltip="Float end"
    [pressed]="state().float === 'end'"
    toggleable
    (click)="floatChange.emit('end')"
  />
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="crop_free"
    ariaLabel="No float"
    pixelTooltip="No float"
    [pressed]="state().float === 'none'"
    toggleable
    (click)="floatChange.emit('none')"
  />
</div>

<pixel-divider orientation="vertical" class="pixel-editor-image-toolbar__rule" />

<div class="pixel-editor-image-toolbar__group" role="group" aria-label="Caption and crop">
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="subtitles"
    [ariaLabel]="state().hasCaption ? 'Remove caption' : 'Add caption'"
    [pixelTooltip]="state().hasCaption ? 'Remove caption' : 'Add caption'"
    (click)="captionToggle.emit()"
  />
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="crop"
    trailingIcon="arrow_drop_down"
    ariaLabel="Crop image"
    pixelTooltip="Crop"
    [pixelMenuTriggerFor]="cropMenu"
  />
  <pixel-menu #cropMenu ariaLabel="Crop image">
    <pixel-menu-item icon="crop_square" (selected)="cropRequest.emit('1:1')">Crop 1:1</pixel-menu-item>
    <pixel-menu-item icon="crop" (selected)="cropRequest.emit('4:3')">Crop 4:3</pixel-menu-item>
    <pixel-menu-item icon="crop_16_9" (selected)="cropRequest.emit('16:9')">Crop 16:9</pixel-menu-item>
  </pixel-menu>
</div>

<pixel-divider orientation="vertical" class="pixel-editor-image-toolbar__rule" />

<pixel-button
  appearance="icon"
  size="sm"
  leadingIcon="delete"
  ariaLabel="Remove image"
  pixelTooltip="Remove"
  (click)="remove.emit()"
/>
