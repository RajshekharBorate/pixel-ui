<div class="pixel-editor-image-toolbar__group" role="group" [attr.aria-label]="l().alignGroup">
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="format_align_left"
    [ariaLabel]="l().alignStart"
    [pixelTooltip]="l().alignStart"
    [pressed]="state().align === 'start'"
    toggleable
    (click)="alignChange.emit('start')"
  />
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="format_align_center"
    [ariaLabel]="l().alignCenter"
    [pixelTooltip]="l().alignCenter"
    [pressed]="state().align === 'center'"
    toggleable
    (click)="alignChange.emit('center')"
  />
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="format_align_right"
    [ariaLabel]="l().alignEnd"
    [pixelTooltip]="l().alignEnd"
    [pressed]="state().align === 'end'"
    toggleable
    (click)="alignChange.emit('end')"
  />
</div>

<pixel-divider orientation="vertical" class="pixel-editor-image-toolbar__rule" />

<div class="pixel-editor-image-toolbar__group" role="group" [attr.aria-label]="l().widthGroup">
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="aspect_ratio"
    trailingIcon="arrow_drop_down"
    [ariaLabel]="l().imageWidth + ': ' + widthLabel()"
    [pixelTooltip]="l().widthTooltip"
    [pixelMenuTriggerFor]="widthMenu"
  />
  <pixel-menu #widthMenu [ariaLabel]="l().imageWidth">
    @for (opt of widthOptions; track opt.value) {
      <pixel-menu-item
        [icon]="state().width === opt.value ? 'check' : 'aspect_ratio'"
        [iconColor]="state().width === opt.value ? 'primary' : 'default'"
        (selected)="widthChange.emit(opt.value)"
      >
        {{ opt.label }}
      </pixel-menu-item>
    }
  </pixel-menu>
</div>

<pixel-divider orientation="vertical" class="pixel-editor-image-toolbar__rule" />

<div class="pixel-editor-image-toolbar__group" role="group" [attr.aria-label]="l().floatGroup">
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="keyboard_tab"
    [ariaLabel]="l().floatStart"
    [pixelTooltip]="l().floatStart"
    [pressed]="state().float === 'start'"
    toggleable
    (click)="floatChange.emit('start')"
  />
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="keyboard_return"
    [ariaLabel]="l().floatEnd"
    [pixelTooltip]="l().floatEnd"
    [pressed]="state().float === 'end'"
    toggleable
    (click)="floatChange.emit('end')"
  />
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="crop_free"
    [ariaLabel]="l().noFloat"
    [pixelTooltip]="l().noFloat"
    [pressed]="state().float === 'none'"
    toggleable
    (click)="floatChange.emit('none')"
  />
</div>

<pixel-divider orientation="vertical" class="pixel-editor-image-toolbar__rule" />

<div class="pixel-editor-image-toolbar__group" role="group" [attr.aria-label]="l().captionAndCrop">
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="subtitles"
    [ariaLabel]="state().hasCaption ? l().removeCaption : l().addCaption"
    [pixelTooltip]="state().hasCaption ? l().removeCaption : l().addCaption"
    (click)="captionToggle.emit()"
  />
  <pixel-button
    appearance="icon"
    size="sm"
    leadingIcon="crop"
    trailingIcon="arrow_drop_down"
    [ariaLabel]="l().cropImage"
    [pixelTooltip]="l().cropTooltip"
    [pixelMenuTriggerFor]="cropMenu"
  />
  <pixel-menu #cropMenu [ariaLabel]="l().cropImage">
    <pixel-menu-item icon="crop_square" (selected)="cropRequest.emit('1:1')">{{ l().crop1x1 }}</pixel-menu-item>
    <pixel-menu-item icon="crop" (selected)="cropRequest.emit('4:3')">{{ l().crop4x3 }}</pixel-menu-item>
    <pixel-menu-item icon="crop_16_9" (selected)="cropRequest.emit('16:9')">{{ l().crop16x9 }}</pixel-menu-item>
  </pixel-menu>
</div>

<pixel-divider orientation="vertical" class="pixel-editor-image-toolbar__rule" />

<pixel-button
  appearance="icon"
  size="sm"
  leadingIcon="delete"
  [ariaLabel]="l().removeImage"
  [pixelTooltip]="l().removeTooltip"
  (click)="remove.emit()"
/>
