<div class="pixel-editor-status-bar__start">
  <span class="pixel-editor-status-bar__block" [attr.aria-label]="currentBlockAria()">
    {{ blockLabel() }}
  </span>
  <button
    type="button"
    class="pixel-editor-status-bar__count"
    [attr.aria-label]="cycleCountAria()"
    [pixelTooltip]="countModeTooltip()"
    (click)="countModeCycle.emit()"
  >
    {{ countLabel() }}
  </button>
  @if (showFormatHint()) {
    <span class="pixel-editor-status-bar__format">
      {{ l().pixelDocumentFormat }}
      <span
        class="material-symbols-outlined pixel-editor-status-bar__help"
        aria-hidden="true"
        [pixelTooltip]="l().formatHintTooltip"
        >help</span
      >
    </span>
  }
</div>
<div class="pixel-editor-status-bar__end">
  <button
    type="button"
    class="pixel-editor-status-bar__action"
    [attr.aria-label]="l().copyAsHtml"
    [pixelTooltip]="l().copyHtmlTooltip"
    (click)="copyHtml.emit()"
  >
    {{ l().htmlShort }}
  </button>
  <button
    type="button"
    class="pixel-editor-status-bar__action"
    [attr.aria-label]="l().copyAsMarkdown"
    [pixelTooltip]="l().copyMarkdownTooltip"
    (click)="copyMarkdown.emit()"
  >
    {{ l().mdShort }}
  </button>
  @if (saveLabel()) {
    <span class="pixel-editor-status-bar__save" [attr.data-state]="saveState()">{{ saveLabel() }}</span>
  }
  @if (savedAtLabel()) {
    <span class="pixel-editor-status-bar__time">{{ savedAtLabel() }}</span>
  }
</div>
