<div class="pixel-editor-status-bar__start">
  <span class="pixel-editor-status-bar__block" aria-label="Current block {{ blockKind() }}">
    {{ blockLabel() }}
  </span>
  <button
    type="button"
    class="pixel-editor-status-bar__count"
    [attr.aria-label]="countLabel() + '. Cycle count mode'"
    [pixelTooltip]="countModeTooltip()"
    (click)="countModeCycle.emit()"
  >
    {{ countLabel() }}
  </button>
  @if (showFormatHint()) {
    <span class="pixel-editor-status-bar__format">
      Pixel Document Format
      <span
        class="material-symbols-outlined pixel-editor-status-bar__help"
        aria-hidden="true"
        pixelTooltip="Documents are stored as structured JSON (Pixel Document Format). HTML is available as a derived export."
        >help</span
      >
    </span>
  }
</div>
<div class="pixel-editor-status-bar__end">
  <button
    type="button"
    class="pixel-editor-status-bar__action"
    aria-label="Copy as HTML"
    pixelTooltip="Copy HTML"
    (click)="copyHtml.emit()"
  >
    HTML
  </button>
  <button
    type="button"
    class="pixel-editor-status-bar__action"
    aria-label="Copy as Markdown"
    pixelTooltip="Copy Markdown"
    (click)="copyMarkdown.emit()"
  >
    MD
  </button>
  @if (saveLabel()) {
    <span class="pixel-editor-status-bar__save" [attr.data-state]="saveState()">{{ saveLabel() }}</span>
  }
  @if (savedAtLabel()) {
    <span class="pixel-editor-status-bar__time">{{ savedAtLabel() }}</span>
  }
</div>
