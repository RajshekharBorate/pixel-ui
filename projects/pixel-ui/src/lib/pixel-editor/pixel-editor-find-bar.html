<div class="pixel-editor-find-bar__grid">
  <div class="pixel-editor-find-bar__row">
    <pixel-input
      class="pixel-editor-find-bar__field"
      size="sm"
      [label]="l().find"
      labelPosition="hidden"
      [placeholder]="l().findPlaceholder"
      [disabled]="disabled()"
      [value]="findQuery()"
      (valueChange)="findQueryChange.emit($event)"
      (keydown.enter)="findNext.emit()"
    />
    <div class="pixel-editor-find-bar__trailing">
      <div class="pixel-editor-find-bar__nav">
        <pixel-button
          appearance="icon"
          size="sm"
          leadingIcon="keyboard_arrow_up"
          [disabled]="disabled() || matchCount() === 0"
          [ariaLabel]="l().previousMatch"
          [pixelTooltip]="l().previousTooltip"
          (click)="findPrev.emit()"
        />
        <pixel-button
          appearance="icon"
          size="sm"
          leadingIcon="keyboard_arrow_down"
          [disabled]="disabled() || matchCount() === 0"
          [ariaLabel]="l().nextMatch"
          [pixelTooltip]="l().nextTooltip"
          (click)="findNext.emit()"
        />
      </div>
      @if (matchStatus(); as status) {
        <span class="pixel-editor-find-bar__status" aria-live="polite" aria-atomic="true">{{
          status
        }}</span>
      }
    </div>
  </div>

  <div class="pixel-editor-find-bar__row">
    <pixel-input
      class="pixel-editor-find-bar__field"
      size="sm"
      [label]="l().replace"
      labelPosition="hidden"
      [placeholder]="l().replacePlaceholder"
      [disabled]="disabled()"
      [value]="replaceQuery()"
      (valueChange)="replaceQueryChange.emit($event)"
      (keydown.enter)="replace.emit()"
    />
    <div class="pixel-editor-find-bar__trailing">
      <div class="pixel-editor-find-bar__actions">
        <pixel-button
          appearance="text"
          size="sm"
          [disabled]="disabled() || matchCount() === 0"
          [ariaLabel]="l().replace"
          (click)="replace.emit()"
          >{{ l().replace }}</pixel-button
        >
        <pixel-button
          appearance="text"
          size="sm"
          [disabled]="disabled() || matchCount() === 0"
          [ariaLabel]="l().replaceAll"
          (click)="replaceAll.emit()"
          >{{ l().replaceAll }}</pixel-button
        >
      </div>
    </div>
  </div>

  <div class="pixel-editor-find-bar__options" role="group" [attr.aria-label]="l().findOptions">
    <pixel-checkbox
      size="sm"
      [label]="l().matchCase"
      [checked]="matchCase()"
      [disabled]="disabled()"
      (checkedChange)="matchCaseChange.emit($event)"
    />
    <pixel-checkbox
      size="sm"
      [label]="l().matchWholeWord"
      [checked]="matchWholeWord()"
      [disabled]="disabled()"
      (checkedChange)="matchWholeWordChange.emit($event)"
    />
  </div>
</div>
