<span class="pixel-chart-pie__sr-only" aria-live="polite" aria-atomic="true">
  {{ summary() }}
</span>
<pixel-chart-host
  [option]="option()"
  [palette]="palette()"
  [ariaLabel]="resolvedAriaLabel()"
  [height]="height()"
  [loading]="loading()"
  [showSkeleton]="showSkeleton()"
  skeletonVariant="pie"
  [skeletonPieLayout]="skeletonPieLayout()"
  [drillable]="drillable()"
  [themeVersion]="themeVersion()"
  (chartClick)="onChartClick($event)"
/>
