<button
  type="button"
  class="pixel-step-header__button"
  role="tab"
  [id]="headerId() || null"
  [attr.aria-controls]="panelId() || null"
  [attr.aria-selected]="selected()"
  [attr.aria-current]="selected() ? 'step' : null"
  [attr.aria-disabled]="state() === 'disabled' || state() === 'locked' ? 'true' : null"
  [attr.aria-label]="labelsCollapsed() ? accessibleName() : null"
  [attr.tabindex]="clickable() ? tabIndex() : -1"
  [disabled]="!clickable()"
  [pixelTooltip]="tooltipMessage()"
  pixelTooltipPosition="bottom"
  (click)="onActivate()"
>
  <span class="pixel-step-header__indicator" aria-hidden="true">
    @switch (state()) {
      @case ('completed') {
        <span class="material-symbols-outlined pixel-step-header__glyph">check</span>
      }
      @case ('error') {
        <span class="material-symbols-outlined pixel-step-header__glyph">priority_high</span>
      }
      @case ('warning') {
        <span class="material-symbols-outlined pixel-step-header__glyph">warning</span>
      }
      @case ('locked') {
        <span class="material-symbols-outlined pixel-step-header__glyph">lock</span>
      }
      @case ('loading') {
        <span class="pixel-step-header__spinner"></span>
      }
      @default {
        @if (iconTemplate(); as iconTpl) {
          <span class="pixel-step-header__custom">
            <ng-container [ngTemplateOutlet]="iconTpl" />
          </span>
        } @else if (icon()) {
          <span class="material-symbols-outlined pixel-step-header__glyph">{{ icon() }}</span>
        } @else {
          <span class="pixel-step-header__number">{{ displayNumber() }}</span>
        }
      }
    }
  </span>

  <span class="pixel-step-header__text">
    <span class="pixel-step-header__label">
      {{ label() }}
      @if (hasBadge()) {
        <pixel-badge
          class="pixel-step-header__badge"
          type="count"
          size="sm"
          position="inline"
          [value]="badge()"
        />
      }
    </span>
    @if (description()) {
      <span class="pixel-step-header__description">{{ description() }}</span>
    }
    @if (optional()) {
      <span class="pixel-step-header__optional">Optional</span>
    }
  </span>
</button>

@if (!last()) {
  <span class="pixel-step-header__connector" aria-hidden="true"></span>
}
