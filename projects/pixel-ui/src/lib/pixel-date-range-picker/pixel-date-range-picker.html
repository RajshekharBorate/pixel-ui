@if (showSkeleton()) {
  <div class="pixel-date-range-picker__skeleton" [class.pixel-date-range-picker__skeleton--left]="labelPosition() === 'left'">
    @if (shouldShowSkeletonLabel()) {
      <pixel-skeleton class="pixel-date-range-picker__skeleton-label" width="38%" height="0.7rem" />
    }
    <pixel-skeleton class="pixel-date-range-picker__skeleton-field" shape="rounded" [height]="skeletonFieldHeight()" />
    @if (helperText()) {
      <pixel-skeleton class="pixel-date-range-picker__skeleton-helper" width="55%" height="0.65rem" />
    }
  </div>
} @else {
<div class="pixel-date-range-picker" [class.pixel-date-range-picker--open]="isOpen()">
  <div class="pixel-date-range-picker__field">
    <pixel-input
      #inputRef
      className="pixel-date-range-picker__input"
      [id]="fieldId()"
      [label]="label()"
      [labelPosition]="labelPosition()"
      [size]="size()"
      [value]="displayText()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [readonly]="readonly()"
      [inheritParentControlErrors]="inheritParentControlErrors()"
      [required]="required()"
      [helperText]="helperText()"
      [validationMessages]="inputValidationMessages()"
      [errorOverride]="inputErrorOverride()"
      [showClear]="showClear()"
      trailingIcon="calendar_today"
      trailingIconLabel="Open calendar"
      [trailingIconTabIndex]="-1"
      [trailingIconDisabled]="isDisabled() || readonly()"
      [ariaLabel]="ariaLabel() || label() || 'Date range'"
      [ariaHasPopup]="'dialog'"
      [ariaExpanded]="isOpen()"
      [ariaControls]="isOpen() ? panelId : ''"
      [autocomplete]="'off'"
      [focusedChrome]="isOpen()"
      (inputChange)="onInputChange($event)"
      (focusChange)="onInputFocusChange($event)"
      (clearClick)="onClear($event)"
      (trailingIconClick)="toggle()"
      (nativeKeydown)="onInputKeydown($event)"
    />

    @if (isOpen()) {
      <div
        #panelRef
        class="pixel-date-range-picker__panel"
        [class.pixel-date-range-picker__panel--top]="effectivePanelEdge() === 'top'"
        role="dialog"
        aria-modal="false"
        [id]="panelId"
        [attr.aria-label]="label() || 'Choose date range'"
      >
        <pixel-calendar
          #calendarRef
          mode="range"
          [rangeStart]="calendarRangeStart()"
          [rangeEnd]="calendarRangeEnd()"
          [previewRangeStart]="previewRangeStart()"
          [previewEnd]="previewRangeEnd()"
          [min]="min()"
          [max]="max()"
          [dateFilter]="dateFilter()"
          [dateClass]="dateClass()"
          [firstDayOfWeek]="firstDayOfWeek()"
          [locale]="locale()"
          [startView]="startView()"
          [showOutsideDays]="showOutsideDays()"
          [disabled]="isDisabled() || readonly()"
          (daySelected)="onCalendarDaySelected($event)"
          (dayHover)="onDayHover($event)"
          (escapePressed)="onCalendarEscape()"
        />
      </div>
    }
  </div>
</div>
}
