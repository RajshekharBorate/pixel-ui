<span class="pixel-chart-bar__sr-only" aria-live="polite" aria-atomic="true">
  {{ summary() }}
</span>
<pixel-chart-host
  [option]="option()"
  [palette]="palette()"
  [ariaLabel]="resolvedAriaLabel()"
  [height]="height()"
  [loading]="loading()"
  [showSkeleton]="showSkeleton()"
  skeletonVariant="bar"
  [skeletonBarMode]="mode()"
  [skeletonBarOrientation]="orientation()"
  [drillable]="drillable()"
  [themeVersion]="themeVersion()"
  [syncGroup]="syncGroup()"
  (chartClick)="onChartClick($event)"
  (dataZoom)="dataZoomChange.emit($event)"
/>
