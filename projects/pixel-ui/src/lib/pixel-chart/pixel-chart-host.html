@if (showSkeleton()) {
  <pixel-skeleton
    class="pixel-chart-host__skeleton"
    preset="chart"
    [chartVariant]="skeletonVariant()"
    [chartBarMode]="skeletonBarMode()"
    [chartBarOrientation]="skeletonBarOrientation()"
    [height]="resolvedHeight()"
  />
} @else {
  <div
    #plot
    class="pixel-chart-host__plot"
    aria-hidden="true"
  ></div>
}
