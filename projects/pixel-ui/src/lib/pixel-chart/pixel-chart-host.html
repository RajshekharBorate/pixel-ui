@if (showSkeleton()) {
  <pixel-skeleton
    class="pixel-chart-host__skeleton"
    preset="chart"
    [chartVariant]="skeletonVariant()"
    [chartBarMode]="skeletonBarMode()"
    [chartBarOrientation]="skeletonBarOrientation()"
    [chartBarLayout]="skeletonBarLayout()"
    [chartPieMode]="skeletonPieMode()"
    [chartBubbleLayout]="skeletonBubbleLayout()"
    [chartPathMode]="skeletonPathMode()"
    [chartPathLayout]="skeletonPathLayout()"
    [chartPieLayout]="skeletonPieLayout()"
    [chartPointsLayout]="skeletonPointsLayout()"
    [chartRadarLayout]="skeletonRadarLayout()"
    [chartMapLayout]="skeletonMapLayout()"
    [height]="resolvedHeight()"
  />
} @else {
  <div
    #plot
    class="pixel-chart-host__plot"
    aria-hidden="true"
  ></div>
}
