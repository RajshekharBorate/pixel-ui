name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:standards
      - run: npm run agent:validate
      - name: Generated AI/docs artifacts must stay clean
        run: npm run lint:generated-clean
      - run: npm run size:charts
      - run: npm run build
      - name: Re-check sizes after build
        run: npm run size:charts
